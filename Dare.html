<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoHRoulette</title>
    <link rel="stylesheet" href="./css.css">
    <script src="./DareDatabase.js" defer></script>
    <script src="./js.js" defer></script>
</head>
<body onload="getDare()">

    <div class="wrapper">
        <div class="card" id="question-card">
            <p id="question">Hey</p>
            <p class="card-title" id="currentPlayer"></p>
            <div class="btn-group">
                <button onclick="nextTurn();getDare();">Next Person</button>
                <button onclick="getDare()">Another Dare</button>
            </div>
        </div>
    </div>
</body>
</html>
