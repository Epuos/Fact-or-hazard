<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToD2</title>
    <link rel="stylesheet" href="./css.css">
    <script src="./database.js" defer></script>
    <script src="./js.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <h1>Fact or Hazard</h1>
        <p class="card-title">A Truth or dare game</p>

        <div class="card" id="add-user-card">
            <h2 class="card-title">Add Player</h2>
            <div class="input-group">
                <input id="Name" type="text" placeholder="Enter name">
                <button onclick="addUser()">Add</button>
            </div>
            <p id="addUserConfirm"></p>
        </div>

        <div class="card" id="user-list-card">
            <h2 class="card-title">Players</h2>
            <ul id="userList"></ul>
            <div class="btn-group">
                <button onclick="loadUsers()">Show Players</button>
                <button class="btn-danger" onclick="clearUsers()">Clear All</button>
            </div>
            <p id="clearUsers"></p>
        </div>

        <div class="card" id="settings-card">
            <div class="setting-group">
                <p class="setting-label">Starting Level</p>
                <div class="toggle-group">
                    <button class="toggle level active" data-level="1" onclick="selectLevel(this)">1</button>
                    <button class="toggle level" data-level="2" onclick="selectLevel(this)">2</button>
                    <button class="toggle level" data-level="3" onclick="selectLevel(this)">3</button>
                    <button class="toggle level" data-level="4" onclick="selectLevel(this)">4</button>
                    <button class="toggle level" data-level="5" onclick="selectLevel(this)">All</button>
                </div>
            </div>
            <div class="btn-group">
                <button onclick="gotoquestionpage()">Start!</button>
            </div>
        </div>

    </div>
</body>
</html>
